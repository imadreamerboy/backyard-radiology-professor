version = 1

[*]
n = 1200
n-gpu-layers = 99
jinja = true
flash-attn = on
no-mmap = false
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1
b = 512
ub = 256

[medgemma-professor]
model = outputs/llama-models/medgemma-professor/medgemma-27b-it-Q4_K_M.gguf
mmproj = outputs/llama-models/medgemma-professor/mmproj-F16.gguf
c = 8192
load-on-startup = true
stop-timeout = 30

[medgemma-localizer]
model = outputs/llama-models/medgemma-localizer/medgemma-1.5-4b-it-Q4_K_M.gguf
mmproj = outputs/llama-models/medgemma-localizer/mmproj-F16.gguf
c = 4096
n = 512
load-on-startup = true
stop-timeout = 30
